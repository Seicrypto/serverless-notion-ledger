name: Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '22.12.0'

jobs:
  preflight:
    name: Run Preflight Pipeline
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

      - name: Print deployment URL
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Deployment URL: ${DEPLOYMENT_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${DEPLOYMENT_ALIAS_URL}" ]; then
            echo "Alias URL: ${DEPLOYMENT_ALIAS_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
