name: Verify API Artifact

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.12.0'
  OPENAPI_LOCAL_PATH: src/libs/api/openapi/openapi.json
  API_REPO: ${{ vars.API_REPO || 'Seicrypto/serverless-notion-ledger-api' }}
  API_WORKFLOW: ${{ vars.API_WORKFLOW || 'pipeline.yml' }}
  API_ARTIFACT_NAME: ${{ vars.API_ARTIFACT_NAME || 'openapi-json' }}
  API_ARTIFACT_FILE: ${{ vars.API_ARTIFACT_FILE || 'openapi.json' }}

jobs:
  verify-api-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download OpenAPI artifact from API repo
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.API_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          repo: ${{ env.API_REPO }}
          workflow: ${{ env.API_WORKFLOW }}
          workflow_conclusion: success
          name: ${{ env.API_ARTIFACT_NAME }}
          path: .tmp/openapi-artifact

      - name: Verify downloaded OpenAPI file exists
        run: test -f ".tmp/openapi-artifact/${{ env.API_ARTIFACT_FILE }}"

      - name: Sync local OpenAPI artifacts
        run: npm run sync:openapi -- --source ".tmp/openapi-artifact/${{ env.API_ARTIFACT_FILE }}"

      - name: Verify generated OpenAPI artifacts are in sync
        run: npm run verify:openapi

      - name: Run adapter tests
        run: npm run test:api
